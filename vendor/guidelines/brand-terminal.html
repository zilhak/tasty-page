<!-- @dsCard group="Brand" viewport="700x230" name="Terminal Specimen" subtitle="The product surface on its own ground, with an OSC-133 prompt" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 18px; background: var(--tasty-bg-app); }
  /* Follows the theme, as the app's focused terminal does. The page draws these lines, so they read the cells for term. RULES.md section 15. */
  .term { background: var(--tasty-surface-terminal-focused-bg); border: 1px solid var(--tasty-border-default); border-radius: var(--tasty-radius);
          padding: 14px 16px; font-family: var(--tasty-font-mono); font-size: 13px; line-height: 1.5;
          color: var(--tasty-surface-terminal-focused-fg); }
  .b { color: var(--tasty-accent-primary-raised); }
  .g { color: var(--tasty-accent-success-raised); }
  .m { color: var(--tasty-accent-agent-raised); }
  .y { color: var(--tasty-accent-warning-raised); }
  .p { color: var(--tasty-accent-attention-raised); }
  .r { color: var(--tasty-accent-danger-raised); }
  .dim { color: var(--tasty-text-muted); }
  .cur { background: var(--tasty-surface-terminal-focused-fg); }
</style>
</head>
<body>
  <div class="term">
<span class="g">~/tasty</span> <span class="b">main</span> <span class="dim">via</span> <span class="p">rust v1.84</span><br/>
<span class="m">❯</span> cargo build --release<br/>
<span class="dim">   Compiling</span> tasty-themes <span class="dim">v0.7.0</span><br/>
<span class="dim">   Compiling</span> tasty-type-appearance <span class="dim">v0.7.0</span><br/>
<span class="g">    Finished</span> <span class="y">release</span> [optimized] target(s) in <span class="p">42.18s</span><br/>
<span class="m">❯</span> tasty --headless <span class="dim"># agent-driven surface, no GUI</span><br/>
<span class="b">surface</span> <span class="g">created</span> id=<span class="y">s_01HX</span> kind=terminal <span class="cur">&nbsp;</span>
  </div>
</body>
</html>
