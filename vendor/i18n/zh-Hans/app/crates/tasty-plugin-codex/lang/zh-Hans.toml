[codex.cli.sub.kill]
description = "按子实例索引终止子 Codex 实例"

[codex.cli.sub.respawn]
description = "Respawn 子 Codex 实例"

[codex.cli.sub.reboot]
description = "重启 Surface 中的 Codex 实例并恢复同一会话（延迟终止 + codex resume）。将此调用作为本轮的最后一个操作，延迟结束后的所有操作都会被中断。"

