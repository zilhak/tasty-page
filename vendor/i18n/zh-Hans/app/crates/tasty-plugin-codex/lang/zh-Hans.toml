[codex.cli.sub.state]
description = "查询单个子实例的状态：idle、needs_input、active 或 exited（与实际运行的 Surface 交叉核对）"

[codex.cli.sub.tell]
description = "保留换行符发送消息并提交。等待宿主响应后返回，不等待任务完成。从 Codex 对话中调用时，目标每轮完成后的结果都会返回该对话；否则，在提供调用方 Surface 时，注册空闲、等待输入和退出通知钩子。"

[codex.cli.sub.notify-caller]
description = "内部使用：报告子实例状态变化并移除匹配的一次性钩子。如果仍能找到目标 Surface，则重新注册完成钩子。由 spawn/tell 钩子调用，不供直接使用。"

