[codex.cli.sub.launch]
description = "启动新工作区并在其终端中启动 Codex"

[codex.cli.sub.spawn]
description = "在拆分的 Surface 中创建子 Codex 实例。等待宿主响应后返回，不等待子任务完成。从 Codex 对话中调用时，子实例每轮完成后的结果都会返回该对话；否则，为父 Surface 注册空闲、等待输入和退出通知钩子。"

[codex.cli.sub.children]
description = "列出指定 Codex 父实例的子实例"

[codex.cli.sub.parent]
