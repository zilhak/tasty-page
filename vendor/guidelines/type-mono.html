<!-- @dsCard group="Type" viewport="700x230" name="Monospace — D2Coding" subtitle="The brand typeface: terminal, code, and metadata" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 22px; background: var(--tasty-surface-terminal-focused-bg); }
  .spec { font-family: var(--tasty-font-mono); color: var(--tasty-surface-terminal-focused-fg); }
  .big { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
  .glyphs { font-size: 15px; color: var(--tasty-text-muted); margin-top: 6px; }
  .code { font-size: 14px; line-height: 1.5; margin-top: 16px; }
  .c-key { color: var(--tasty-accent-agent-raised); }
  .c-fn  { color: var(--tasty-accent-primary-raised); }
  .c-str { color: var(--tasty-accent-success-raised); }
  .c-num { color: var(--tasty-accent-attention-raised); }
  .c-com { color: var(--tasty-text-muted); }
  .lig { color: var(--tasty-accent-info-raised); }
</style>
</head>
<body>
  <div class="spec">
    <div class="big">D2Coding ligature</div>
    <div class="glyphs">ABCDEFG abcdefg 0123456789 &amp;@#$%&lt;&gt;=*  가나다 ライ</div>
    <pre class="code"><span class="c-com">// ligatures: <span class="lig">-&gt;  =&gt;  !=  &gt;=  ==  ::  |&gt;</span></span>
<span class="c-key">pub fn</span> <span class="c-fn">surface</span>(<span class="c-num">id</span>: &amp;str) <span class="lig">-&gt;</span> &amp;SurfaceTheme {
    <span class="c-key">self</span>.themes.get(id).unwrap_or(<span class="c-str">"fallback"</span>)
}</pre>
  </div>
</body>
</html>
