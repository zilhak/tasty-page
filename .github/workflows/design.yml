name: Design

# Guards the design source in vendor/, which the Tasty app follows.
# Every change builds the site and checks that the design pages keep their
# contrast, that both token lists match the token CSS,
# and that the icon files and the icon component draw the same glyphs.

on:
  push:
    branches: [develop, release, main]
  pull_request:

concurrency:
  group: design-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  design-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Test the ground-ink token verifier
        run: python3 -B scripts/design-tokens/test_verify_ground_ink_tokens.py -v

      - name: Test the contrast checker
        run: node --test scripts/contrast-page.test.mjs scripts/contrast-watchdog.test.mjs

      - run: npm ci

      - run: npm run build

      # Install the Chromium build that matches playwright-core, so the contrast
      # check renders with the same browser version everywhere it runs.
      - run: npx playwright-core install --with-deps chromium

      - run: npm run check-contrast

      # Generate the DTCG token JSON from the CSS before checking both lists.
      - name: Check that the token lists match the token CSS
        run: |
          python3 scripts/design-tokens/gen_tokens_json.py vendor vendor/tokens/tasty.tokens.json vendor/tokens/tasty.tokens.json
          git diff --exit-code vendor/tokens/tasty.tokens.json
          python3 scripts/design-tokens/verify_tokens_json.py vendor vendor/tokens/tasty.tokens.json
          python3 scripts/design-tokens/verify_ground_ink_tokens.py vendor vendor/tokens/ground-ink-rules.json

      # tokens.css repeats tier 1 values that the token tools read from primitives.css.
      - run: npm run check-tokens-copy

      - run: npm run check-icons
