name: Pages

# Build the site with Astro and publish it to GitHub Pages.
# Every push to main or release builds the site and checks its links.
#
# The public domain is still deployed from the Tasty repository. Until the
# domain moves here, deploy only on a manual run from the release branch.
# After the move, deploy on every push to release instead.

on:
  push:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A new run cancels the previous one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # Read the version and asset names of the latest Tasty release for the download links.
      - name: Resolve latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view --repo zilhak/tasty --json tagName,assets > release.json

      - run: npm run build

      # Check internal links and anchors in the generated HTML.
      - run: npm run check-links

      # Pages setup and upload run only when the deploy job runs.
      - if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release'
        uses: actions/configure-pages@v5

      - if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
