# Checks that compare the user guide in content/ with the Tasty source tree.
# The Tasty source is expected at ../.tasty-src: a checkout in CI, a symlink to a
# local clone otherwise. This crate is not a member of the Tasty workspace.
# Cargo.lock is not tracked. Copy .tasty-src/Cargo.lock to checks/Cargo.lock before a run.
[package]
name = "tasty-page-checks"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# An empty table keeps Cargo from looking for a workspace above this repository.
[workspace]

[dependencies]

[dev-dependencies]
clap = "4"
tasty-cli = { path = "../.tasty-src/crates/tasty-cli" }
tasty-doc-guards = { path = "../.tasty-src/crates/tasty-doc-guards" }

# This crate is its own workspace, so the Tasty workspace's [patch] table does not reach it.
# A patch is not written here: an older Tasty ref (release, a tag) may lack the vendored
# copy, and Cargo stops on a patch path that does not exist. The cargo test step in
# .github/workflows/checks.yml passes it with --config when the copy is there.
