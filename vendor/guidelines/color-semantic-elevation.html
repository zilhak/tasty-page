<!-- @dsCard group="Colors" viewport="700x200" name="Semantic — Elevation & Text" subtitle="What UI code references, not raw ramp names" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 20px; background: var(--tasty-bg-app); display: grid; gap: 12px; }
  .stack { display: flex; gap: 0; border-radius: var(--tasty-radius); overflow: hidden; border: 1px solid var(--tasty-separator); }
  .lvl { flex: 1; padding: 14px 12px 16px; color: var(--tasty-text-primary); }
  .tag { font-family: var(--tasty-font-mono); font-size: 10.5px; color: var(--tasty-text-muted); }
  .name { font-size: 12px; font-weight: 600; margin-top: 4px; }
  /* Each level reads its own cell in RULES.md section 6: muted text and body text for that ground. */
  .lvl--raised .tag { color: var(--tasty-text-muted-raised); }
  .lvl--state, .lvl--state .tag { color: var(--tasty-text-on-active); }
  .texts { display: flex; gap: 18px; align-items: baseline; padding: 0 2px; }
  .texts span { font-size: 14px; }
</style>
</head>
<body>
  <div class="stack">
    <div class="lvl" style="background:var(--tasty-bg-app)"><div class="tag">--tasty-bg-app</div><div class="name">window</div></div>
    <div class="lvl" style="background:var(--tasty-bg-sidebar)"><div class="tag">--tasty-bg-sidebar</div><div class="name">sidebar</div></div>
    <div class="lvl" style="background:var(--tasty-bg-panel)"><div class="tag">--tasty-bg-panel</div><div class="name">panel</div></div>
    <div class="lvl lvl--raised" style="background:var(--tasty-surface-raised)"><div class="tag">--tasty-surface-raised</div><div class="name">raised</div></div>
    <div class="lvl lvl--state" style="background:var(--tasty-surface-hover)"><div class="tag">--tasty-surface-hover</div><div class="name">hover</div></div>
    <div class="lvl lvl--state" style="background:var(--tasty-surface-active)"><div class="tag">--tasty-surface-active</div><div class="name">active</div></div>
  </div>
  <div class="texts">
    <span style="color:var(--tasty-text-primary)">primary</span>
    <span style="color:var(--tasty-text-secondary)">secondary</span>
    <span style="color:var(--tasty-text-muted)">muted</span>
    <span style="color:var(--tasty-text-disabled)" data-ink-grade="none" data-ink-why="disabled">disabled</span>
    <span style="color:var(--tasty-text-placeholder)">placeholder</span>
  </div>
</body>
</html>
