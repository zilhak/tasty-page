name: Checks

# Compares the user guide in content/ with the Tasty source it describes.
# The Tasty source is checked out into .tasty-src:
#   develop and release (and pull requests into them, scheduled runs) -> Tasty main
#   main (and pull requests into main) -> the Tasty tag with the same name as the
#     latest tag reachable in this repository
# A release candidate is checked before its tag exists, so release follows Tasty
# main, where the Tasty release is prepared.
# The daily run catches Tasty changes that land while this repository is quiet.
on:
  push:
    branches: [develop, release, main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guide-against-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The main side needs the tags to find its Tasty version.
          fetch-depth: 0

      - name: Choose the Tasty ref
        id: tasty
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            branch="$BASE_REF"
          elif [ "$EVENT" = "schedule" ]; then
            branch=develop
          else
            branch="$REF_NAME"
          fi
          if [ "$branch" = "main" ]; then
            if ! ref=$(git describe --tags --abbrev=0 HEAD); then
              echo "::error::No tag is reachable from main. Tag each release with the Tasty release tag."
              exit 1
            fi
          else
            ref=main
          fi
          echo "Tasty ref for $branch: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: zilhak/tasty
          ref: ${{ steps.tasty.outputs.ref }}
          path: .tasty-src
          persist-credentials: false

      # The crate depends on the Tasty source by path, so its dependencies move with
      # the ref above. Take the versions from that ref instead of a lock file here.
      - name: Use the Tasty lock file
        run: cp .tasty-src/Cargo.lock checks/Cargo.lock

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            checks/target
          key: checks-${{ runner.os }}-${{ hashFiles('.tasty-src/Cargo.lock', 'checks/rust-toolchain.toml') }}-${{ steps.tasty.outputs.ref }}
          restore-keys: |
            checks-${{ runner.os }}-${{ hashFiles('.tasty-src/Cargo.lock', 'checks/rust-toolchain.toml') }}-

      # rustup reads rust-toolchain.toml from the working directory, so run from checks/.
      # No --locked: Cargo has to drop the Tasty workspace members from the copied lock file.
      - name: cargo test
        working-directory: checks
        run: cargo test --manifest-path Cargo.toml --no-fail-fast
