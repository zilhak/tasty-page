<!-- @dsCard group="Colors" viewport="700x190" name="States — Overlays & Selection" subtitle="hover/active overlays + terminal selection, derived from is_light" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 20px; background: var(--tasty-bg-app); display: grid; gap: 14px; }
  .demo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cell { background: var(--tasty-surface-raised); border: 1px solid var(--tasty-border-default); border-radius: var(--tasty-radius);
          height: 56px; display: flex; align-items: center; justify-content: center;
          font-size: 12px; color: var(--tasty-text-secondary-raised); position: relative; }
  .cell span { position: relative; }
  .cell--hover, .cell--active { color: var(--tasty-text-on-active); }
  /* The wash lies under the label, as it does in the app. -1px reaches past the border to the whole box. */
  .cell--hover::before, .cell--active::before { content: ""; position: absolute; inset: -1px; border-radius: var(--tasty-radius); }
  .cell--hover::before { background: var(--tasty-overlay-hover); }
  .cell--active::before { background: var(--tasty-overlay-active); }
  .lbl { font-family: var(--tasty-font-mono); font-size: 10.5px; color: var(--tasty-text-muted); margin-top: 6px; text-align: center; }
  .term { background: var(--tasty-surface-terminal-focused-bg); border-radius: var(--tasty-radius); padding: 12px 14px; font-family: var(--tasty-font-mono);
          font-size: 13px; color: var(--tasty-surface-terminal-focused-fg); border: 1px solid var(--tasty-border-default); }
  .sel { background: var(--tasty-selection-bg); color: var(--tasty-text-on-active); }
  .vi { background: var(--tasty-vi-cursor-bg); color: var(--tasty-vi-cursor-fg); }
  .sm { background: var(--tasty-search-match-bg); color: var(--tasty-text-primary); }
  .sma { background: var(--tasty-search-match-active-bg); color: var(--tasty-search-match-active-fg); }
</style>
</head>
<body>
  <div>
    <div class="demo">
      <div><div class="cell"><span>rest</span></div><div class="lbl">base</div></div>
      <div><div class="cell cell--hover"><span>hover</span></div><div class="lbl">--tasty-overlay-hover · 8%</div></div>
      <div><div class="cell cell--active"><span>active</span></div><div class="lbl">--tasty-overlay-active · 12%</div></div>
    </div>
  </div>
  <div class="term">grep <span class="sel">selection_bg</span> · vi cursor <span class="vi">&nbsp;cell&nbsp;</span> · search <span class="sm">match</span> <span class="sma">active</span></div>
</body>
</html>
