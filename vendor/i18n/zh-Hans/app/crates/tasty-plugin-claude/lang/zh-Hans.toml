claude = "Claude Code"

[claude.cli.sub.launch]
description = "在新工作区中启动 Claude Code"

[claude.cli.sub.spawn]
description = "在工作区中 Spawn 一个子 Claude 实例。立即返回；子实例每次转为 idle/needs_input 时都会向调用方 Surface 发送通知，退出时再发送一次——不限于首次状态转换。"

[claude.cli.sub.children]
description = "列出指定 Claude 父实例的子实例"

[claude.cli.sub.parent]
description = "显示指定 Claude 子实例的父实例"

[claude.cli.sub.state]
description = "查询单个子实例的状态：idle、needs_input、active 或 exited（与实际存续的 Surface 交叉核对）"

[claude.cli.sub.tell]
description = "向 Claude 实例发送消息（支持多行，在末尾提交）。立即返回；目标每次转为 idle/needs_input 时都会向调用方 Surface 发送通知，退出时再发送一次——不限于首次状态转换。"

[claude.cli.sub.broadcast]
description = "向 Claude 父实例的所有子实例广播文本"

[claude.cli.sub.kill]
description = "按子实例索引终止 Claude 子实例"

[claude.cli.sub.codex-returns]
description = "列出以 Codex 为父实例、尚未能将轮次结果交给 Codex 插件的子实例轮次结果，同时显示接收方、正文和重试状态。--retry 将所有列出的结果重新排入立即发送的队列，包括已停止自动重试的结果，并立即返回，不等待发送。"

[claude.cli.sub.remote-results]
description = "列出远程附加子实例返回给 Surface 父实例（Claude 会话或 Shell）的轮次结果，或显示单个结果及其正文。每个结果均先存储，再将其 ID 写入父实例的完成日志；子实例关闭后结果仍保留。"

[claude.cli.sub.respawn]
description = "Respawn 一个 Claude 子实例"

[claude.cli.sub.reboot]
description = "重新启动 Surface 中的 Claude 实例并恢复同一会话（延迟终止 + claude -r）。将此调用作为一轮的最后一个操作——延迟结束后的所有操作都会被中断。"

[claude.cli.sub.child-profile]
description = "将持久化 Claude 会话配置档附加到子实例（将 --child 解析为其 Surface，然后在其上执行与 'claude reboot --profile' 相同的操作序列）。与 Reboot 不同，此操作不会中断调用方的当前轮次——仅重新启动子实例。子实例转为 idle/needs_input 时会向调用方 Surface 发送通知，退出时再发送一次。"

[claude.cli.sub.install]
description = "安装或更新 Tasty 钩子和受管理的 Claude 通知模组；保留现有用户钩子和插件路径。响应包含 installed 和 updated 钩子事件以及 mod_updated。"

[claude.cli.sub.uninstall]
description = "移除 Tasty 钩子以及受管理的通知模组路径和资源，保留其他用户设置。"

[claude.cli.sub.hook]
description = "Claude Code 钩子集成。由 Claude Code 钩子系统调用时，从 stdin 读取 JSON 载荷（session_id, cwd, prompt_id, message, notification_type, error, agent_id, background_tasks, tool_name, tool_response, prompt, source, reason, last_assistant_message）。同时防御性读取 waiting_on_background_work，尽管官方钩子文档和实际观测的载荷均未包含该字段。"

[claude.cli.sub.checklist-hook]
description = "Stop 钩子的 Gate 判定。从 stdin 读取 JSON 载荷（session_id, prompt_id, stop_hook_active, last_assistant_message）；--gate 选择用于判定的已注册 Gate（默认：continue-checklist）。"

[claude.cli.sub.checklist-enable]
description = "启用 Stop 钩子的 Gate（创建其启用标记）。默认为内置的 continue-checklist Gate。"

[claude.cli.sub.checklist-disable]
description = "禁用 Stop 钩子的 Gate（移除其启用标记）。即使已禁用也会成功。"

[claude.cli.sub.checklist-status]
description = "显示 Stop 钩子的 Gate 当前是否启用。使用 'claude gate-list' 一次查看所有 Gate 的启用或禁用状态。"

[claude.cli.sub.notify-stop-failure]
description = "内部使用：子实例的一轮因 API 错误结束，但仍因后台工作而等待时，向调用方的通知日志写入一行。如果该轮直接结束，则不写入任何内容，因为完成行已指明错误。用作 claude-stop-failure 的 hook.set 命令。"

[claude.cli.sub.notify-error]
description = "内部使用：子实例的输出长时间没有变化时，通知调用方该子实例可能已停滞。用作 claude-error-stalled 的 hook.set 命令。不更改子实例状态，也不移除或重新注册完成钩子。"

[claude.cli.sub.notify-done]
description = "内部使用：向调用方报告 spawn/tell 状态转换，并移除匹配的一次性钩子。如果仍能找到目标 Surface，则重新注册三个完成钩子。用作 claude-idle/needs-input/process-exit 的 hook.set 命令。"

[claude.cli.sub.profile-register]
description = "按名称注册 Claude 会话配置档（将文件复制到插件私有存储；重新注册同名配置档会更新其内容）"

[claude.cli.sub.profile-unregister]
description = "移除已注册的 Claude 会话配置档"

[claude.cli.sub.profile-list]
description = "列出所有可按名称附加的内容——已注册的 Claude 会话配置档和 Stop 钩子的 Gate——以及始终安装的内置钩子"

[claude.cli.sub.profile-show]
description = "显示按名称附加的内容——已注册 Claude 会话配置档的原始设置 JSON，或为 Gate 生成的 Stop 钩子片段"

[claude.cli.sub.profile-current]
description = "显示附加到 Surface 的 Claude 会话配置档（如有），以及始终安装的内置钩子"

[claude.cli.sub.gate-register]
description = "按名称注册 Stop 钩子的 Gate（将正文文件复制到插件私有存储；重新注册同名 Gate 会替换正文和定义）"

[claude.cli.sub.gate-unregister]
description = "移除已注册的 Stop 钩子 Gate（删除其定义和正文副本）"

[claude.cli.sub.gate-list]
description = "列出已注册及内置的 Stop 钩子 Gate，以及各 Gate 的实际生效标记、轮数上限和启用或禁用状态"

[claude.cli.sub.gate-show]
description = "显示 Stop 钩子 Gate 的定义和正文"

[claude.cli.arg.launch_args.workspace]
help = "要创建的工作区名称（默认为 \"claude\"）"

[claude.cli.arg.launch_args.directory]
