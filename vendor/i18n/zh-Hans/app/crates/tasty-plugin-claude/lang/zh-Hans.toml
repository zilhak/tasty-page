[claude.checklist]
body = """
结束本轮前，检查：
1. 结果是否确实满足了请求，而不只是完成了最容易做的部分？
2. 如果修改了代码或配置，是否实际验证过（构建/测试/运行），而不只是认为它能正常工作？
3. 是否还有后续工作？如果有，说明具体内容。如果没有，明确说明。

{{goal}}
如果以上三项确实全部满足，在回复中任意位置包含原样字符串 [[TASTY-CHECKLIST-DONE]]。否则，继续工作。
"""
goal_clause = """
本次会话设定的目标：{}
根据该目标判断刚才描述的后续工作。如果其中有无需用户决策且可以自行完成的工作，不得在此停止，继续执行。如果剩余工作全部需要用户判断或超出目标范围，可以停止。
"""
