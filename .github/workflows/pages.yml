name: Pages

# Build the site with Astro and publish it to GitHub Pages.
# A push to main builds the site and checks its links and sitemap only.
# A push to release, or a manual run on release, also deploys the build.
# The deploy condition appears in three places that must stay the same: the
# configure-pages step, the upload-pages-artifact step, and the deploy job.

on:
  push:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # A new build on the same branch cancels the previous build.
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # Read the version and asset names of the latest Tasty release for the download links.
      - name: Resolve latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view --repo zilhak/tasty --json tagName,assets > release.json

      - run: npm run build

      # Check internal links and anchors in the generated HTML.
      - run: npm run check-links

      # Every public page in the build must be in the sitemap, and nothing else.
      - run: npm run check-sitemap

      # Pages setup and upload run only when the deploy job runs.
      - if: github.ref == 'refs/heads/release' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@v5

      - if: github.ref == 'refs/heads/release' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/release' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    # Never cancel a deploy that has started; queue the next one instead.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
